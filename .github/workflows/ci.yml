name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  content:
    name: Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated content matches content/
        run: pnpm sync:check
      # Presence only: every fact carries a verified date. The 60-day age gate runs nightly (nightly.yml), so a
      # date going stale opens the freshness issue instead of blocking every pull request.
      - name: Every fact carries a verified date
        run: pnpm check:facts
      - name: Anti-goal grep
        run: bash scripts/anti-goals.sh

  skill:
    name: Skill and plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: skills-ref validate
        run: npx -y skills-ref@0.1.5 validate packages/skill/skills/bsv-dev
      # userConfig.options needs Claude Code v2.1.271 or later; pinned to the version verified locally.
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.303
      # A directory holding a marketplace.json validates only that file, so plugin.json and the component
      # directories are validated explicitly too (the same targets as packages/skill/tests/plugin.test.ts).
      - name: claude plugin validate --strict
        run: |
          claude plugin validate --strict packages/skill
          claude plugin validate --strict packages/skill/.claude-plugin/plugin.json
          claude plugin validate --strict packages/skill/commands
          claude plugin validate --strict packages/skill/skills
          claude plugin validate --strict .
      - name: Skill tests (with the skills-ref and claude CLI tests)
        run: pnpm -F bsv-dev-skill test
        env:
          SKILLS_REF_TESTS: '1'
          CLAUDE_CLI_TESTS: '1'
      - name: Anti-goal grep over the skill
        run: bash scripts/anti-goals.sh packages/skill/skills

  sample:
    name: Sample (bsv-tipping-demo)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The guardrails CLI is part of @bsv/mcp's build.
      - run: pnpm -F @bsv/mcp build
      - run: pnpm -F bsv-tipping-demo build
      - run: pnpm -F bsv-tipping-demo test
      # check_guardrails takes an absolute path; the CLI exits 1 on any `error` finding.
      - name: check_guardrails over the sample (zero error findings)
        run: node packages/mcp/build/cli/check-guardrails.js "$GITHUB_WORKSPACE/samples/tipping-shape-a"
      - name: Anti-goal grep over the sample
        run: bash scripts/anti-goals.sh samples/tipping-shape-a
      # The same Dockerfile and repo-root context as sample-ghcr.yml, amd64 only; nothing is pushed.
      - name: Docker build (linux/amd64, no push)
        run: docker build --platform linux/amd64 -f samples/tipping-shape-a/Dockerfile .
