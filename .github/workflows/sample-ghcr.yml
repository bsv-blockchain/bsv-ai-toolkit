name: Sample image (bsv-tipping-demo)

# Builds samples/tipping-shape-a into ghcr.io/bsv-blockchain/bsv-tipping-demo, modelled on the demos' ghcr.yml.
# Only pushes to main (when the sample, the workspace files the image build copies, or this file changed) and v*
# tags on a commit that is on main; never a pull request, so the push below never runs on code that has not been
# merged. Path filters do not apply to tag pushes.
on:
  push:
    branches: [main]
    paths: ['samples/tipping-shape-a/**', 'pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.github/workflows/sample-ghcr.yml']
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bsv-blockchain/bsv-tipping-demo

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth 0 brings the history for the ancestry check; no token is left in .git/config.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # As release.yml: a v* tag pushed on a commit that never reached main publishes nothing.
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Context is the repo root (the pnpm workspace and lockfile); samples/tipping-shape-a/Dockerfile.dockerignore
      # keeps everything but the workspace files and the sample out. No token or secret is passed to the build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: samples/tipping-shape-a/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
